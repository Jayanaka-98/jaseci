apiVersion: apps/v1
kind: Deployment
metadata:
  name: APP_NAME-litellm
  labels:
    app: APP_NAME-litellm
    managed: jac-scale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: APP_NAME-litellm
  template:
    metadata:
      labels:
        app: APP_NAME-litellm
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: APP_NAME-litellm-secret
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: litellm-config
          configMap:
            name: APP_NAME-litellm-config
